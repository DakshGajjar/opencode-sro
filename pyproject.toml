[project]
name = "sro"
version = "0.1.0"
description = "SRO - Security Research Orchestrator: an OpenCode-native security research harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sro = "sro.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "sro",
  "sro.core",
  "sro.readers",
  "sro.readers.bugcrowd",
  "sro.readers.hackerone",
  "sro.readers.intigriti",
  "sro.connectors",
  "sro.connectors.mcp",
  "sro.cli",
]

[tool.setuptools.package-data]
sro = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
